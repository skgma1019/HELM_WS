<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>HELM 개발용 테스트 콘솔</title>
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, "Segoe UI", "맑은 고딕", sans-serif;
  }
  body {
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 18px;
  }
  .warning {
    background: #fff3cd;
    border: 1px solid #e6c200;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  fieldset {
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 16px;
    padding: 12px 16px;
  }
  legend {
    font-weight: bold;
    font-size: 13px;
    padding: 0 4px;
  }
  label {
    display: block;
    font-size: 13px;
    margin-top: 8px;
  }
  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    margin-top: 2px;
    font-size: 14px;
  }
  .radio-row {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 13px;
  }
  .radio-row label {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 0;
  }
  .photo-mode-panel {
    margin-top: 6px;
  }
  .sample-empty {
    font-size: 13px;
    color: #c0392b;
  }
  input[type="range"] {
    width: 100%;
    margin-top: 4px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slider-row input[type="range"] {
    flex: 1;
  }
  .value-label {
    font-size: 13px;
    color: #555;
    min-width: 56px;
    text-align: right;
  }
  .station-info {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }
  .judgement-preview {
    font-family: "Consolas", monospace;
    font-size: 12px;
    background: #f0f0f0;
    border-radius: 4px;
    padding: 8px;
    margin-top: 10px;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div {
    flex: 1;
  }
  button {
    padding: 10px;
    font-size: 14px;
    border-radius: 4px;
    border: 1px solid #999;
    background: #f5f5f5;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
  }
  button:hover {
    background: #eaeaea;
  }
  button.primary {
    border-color: #c0392b;
    color: #c0392b;
  }
  button.ok {
    border-color: #27ae60;
    color: #27ae60;
  }
  #log {
    font-family: "Consolas", monospace;
    font-size: 12px;
    background: #1e1e1e;
    color: #ddd;
    padding: 10px;
    border-radius: 6px;
    height: 260px;
    overflow-y: auto;
  }
  .log-entry {
    white-space: pre-wrap;
    padding: 2px 0;
    border-bottom: 1px solid #333;
  }
  .log-entry.ok::before {
    content: "[성공] ";
    color: #6fcf97;
  }
  .log-entry.err::before {
    content: "[실패] ";
    color: #eb5757;
  }
</style>
</head>
<body>
<h1>HELM 개발용 테스트 콘솔</h1>
<p class="warning">
  개발용 페이지입니다. HELM_DEV=1일 때만 서빙되며, EC2 운영 배포본에는 절대 올라가면 안 됩니다.
</p>

<fieldset>
  <legend>연결 설정</legend>
  <label for="token">로봇 토큰 (X-Robot-Token)</label>
  <input type="text" id="token" placeholder="HELM_ROBOT_TOKEN 값" />

  <label for="robotId">robot_id</label>
  <input type="text" id="robotId" value="helm-01" />
</fieldset>

<fieldset>
  <legend>순찰 지점 (station)</legend>
  <label for="station">station</label>
  <select id="station">
    <option value="A">A — 1번 설비 전면</option>
    <option value="B">B — 2번 설비 측면</option>
    <option value="C">C — 적재장 통로</option>
  </select>
  <div class="station-info" id="stationInfo"></div>
</fieldset>

<fieldset>
  <legend>판정 시뮬레이션 (이벤트 전송용)</legend>

  <label for="visionScore">vision.score (threshold = 0.5)</label>
  <div class="slider-row">
    <input type="range" id="visionScore" min="0" max="1.5" step="0.01" value="0.3" />
    <span class="value-label" id="visionScoreValue">0.30</span>
  </div>

  <label for="thermalTemp">thermal.max_temp_c (threshold = 50.0°C)</label>
  <div class="slider-row">
    <input type="range" id="thermalTemp" min="20" max="80" step="0.5" value="35" />
    <span class="value-label" id="thermalTempValue">35.0°C</span>
  </div>

  <div class="judgement-preview" id="judgementPreview"></div>

  <label>사진 첨부 (선택)</label>
  <div class="radio-row">
    <label><input type="radio" name="photoMode" value="sample" checked /> 샘플 사용</label>
    <label><input type="radio" name="photoMode" value="file" /> 직접 선택</label>
  </div>

  <div class="photo-mode-panel" id="samplePanel">
    <select id="sampleSelect"></select>
    <div class="sample-empty" id="sampleEmpty" style="display: none">
      data/samples/ 에 이미지가 없습니다 — 사진 없이 전송됩니다
    </div>
  </div>
  <div class="photo-mode-panel" id="filePanel" style="display: none">
    <input type="file" id="image" accept="image/*" />
  </div>

  <button class="primary" id="btn-send-event">이벤트 전송</button>
</fieldset>

<fieldset>
  <legend>로봇 상태 갱신 (이벤트 없음 — station 위치 그대로 사용)</legend>
  <label for="state">state</label>
  <select id="state">
    <option value="patrolling">patrolling</option>
    <option value="idle">idle</option>
    <option value="estop">estop</option>
    <option value="charging">charging</option>
  </select>

  <label for="battery">battery</label>
  <div class="slider-row">
    <input type="range" id="battery" min="0" max="100" step="1" value="80" />
    <span class="value-label" id="batteryValue">80%</span>
  </div>

  <label for="yaw">yaw (지도 위 로봇 방향 확인용, station의 yaw와 별개)</label>
  <div class="slider-row">
    <input type="range" id="yaw" min="0" max="360" step="1" value="0" />
    <span class="value-label" id="yawValue">0°</span>
  </div>

  <button class="ok" id="btn-normal">상태 갱신</button>
</fieldset>

<fieldset>
  <legend>전송 로그</legend>
  <div id="log"></div>
</fieldset>

<script>
  const $ = (id) => document.getElementById(id);

  // mock_robot.py의 STATIONS와 같은 좌표 — 서로 다른 방식으로 테스트해도 지도 위에서 같은 자리에 찍히게
  const STATIONS = [
    { id: "A", name: "1번 설비 전면", x: 1.0, y: 1.0, yaw: 0.0 },
    { id: "B", name: "2번 설비 측면", x: 8.0, y: 1.0, yaw: Math.PI / 2 },
    { id: "C", name: "적재장 통로", x: 8.0, y: 6.0, yaw: Math.PI },
  ];
  const VISION_THRESHOLD = 0.5;
  const THERMAL_THRESHOLD_C = 50.0;

  let seqCounter = 0;

  function currentStation() {
    return STATIONS.find((s) => s.id === $("station").value) || STATIONS[0];
  }

  function updateStationInfo() {
    const st = currentStation();
    $("stationInfo").textContent = `x=${st.x.toFixed(2)}  y=${st.y.toFixed(2)}  yaw=${st.yaw.toFixed(2)}rad`;
  }

  function updateJudgementPreview() {
    const score = parseFloat($("visionScore").value);
    const temp = parseFloat($("thermalTemp").value);
    $("visionScoreValue").textContent = score.toFixed(2);
    $("thermalTempValue").textContent = `${temp.toFixed(1)}°C`;

    const visionAnomaly = score >= VISION_THRESHOLD;
    const thermalAnomaly = temp >= THERMAL_THRESHOLD_C;
    const verdict = visionAnomaly || thermalAnomaly ? "ANOMALY" : "NORMAL";
    const ratio = (score / VISION_THRESHOLD).toFixed(2);
    $("judgementPreview").textContent =
      `ratio=${ratio}  vision=${visionAnomaly ? "이상" : "정상"}  thermal=${thermalAnomaly ? "이상" : "정상"}  →  verdict=${verdict}`;
  }

  $("station").addEventListener("change", updateStationInfo);
  $("visionScore").addEventListener("input", updateJudgementPreview);
  $("thermalTemp").addEventListener("input", updateJudgementPreview);

  function loadSaved() {
    $("token").value = localStorage.getItem("helm_dev_token") || "";
    $("robotId").value = localStorage.getItem("helm_dev_robot_id") || "helm-01";
  }
  $("token").addEventListener("input", () => localStorage.setItem("helm_dev_token", $("token").value));
  $("robotId").addEventListener("input", () => localStorage.setItem("helm_dev_robot_id", $("robotId").value));

  $("battery").addEventListener("input", () => {
    $("batteryValue").textContent = `${$("battery").value}%`;
  });
  $("yaw").addEventListener("input", () => {
    $("yawValue").textContent = `${$("yaw").value}°`;
  });

  function log(message, ok) {
    const el = document.createElement("div");
    el.className = "log-entry " + (ok ? "ok" : "err");
    const time = new Date().toLocaleTimeString();
    el.textContent = `[${time}] ${message}`;
    $("log").prepend(el);
  }

  function blobToBase64(blob) {
    // File도 Blob이라 파일 선택/샘플 fetch 양쪽 다 이 함수 하나로 처리한다
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function loadSampleList() {
    const select = $("sampleSelect");
    const empty = $("sampleEmpty");
    try {
      const res = await fetch("/api/dev/samples");
      const data = await res.json();
      const samples = data.samples || [];
      select.innerHTML = "";
      if (samples.length === 0) {
        select.style.display = "none";
        empty.style.display = "block";
        return;
      }
      select.style.display = "block";
      empty.style.display = "none";
      for (const name of samples) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      }
      select.value = samples[0];
    } catch (err) {
      select.style.display = "none";
      empty.style.display = "block";
      log(`샘플 목록을 불러오지 못함: ${err}`, false);
    }
  }

  function setupPhotoModeToggle() {
    const radios = document.querySelectorAll('input[name="photoMode"]');
    radios.forEach((radio) => {
      radio.addEventListener("change", () => {
        const mode = document.querySelector('input[name="photoMode"]:checked').value;
        $("samplePanel").style.display = mode === "sample" ? "block" : "none";
        $("filePanel").style.display = mode === "file" ? "block" : "none";
      });
    });
  }

  async function getImageBase64() {
    const mode = document.querySelector('input[name="photoMode"]:checked').value;

    if (mode === "file") {
      const file = $("image").files[0];
      return file ? blobToBase64(file) : null;
    }

    const filename = $("sampleSelect").value;
    if (!filename) return null; // 샘플 없음 -> 사진 없이 전송
    const res = await fetch(`/api/dev/samples/${encodeURIComponent(filename)}`);
    if (!res.ok) {
      log(`샘플 이미지를 불러오지 못함: ${filename}`, false);
      return null;
    }
    const blob = await res.blob();
    return blobToBase64(blob);
  }

  function getCommonFields() {
    const token = $("token").value.trim();
    const robotId = $("robotId").value.trim() || "helm-01";
    return { token, robotId };
  }

  async function sendEvent() {
    const { token, robotId } = getCommonFields();
    if (!token) {
      log("토큰을 먼저 입력하세요", false);
      return;
    }

    const station = currentStation();
    const score = parseFloat($("visionScore").value);
    const temp = parseFloat($("thermalTemp").value);
    const visionAnomaly = score >= VISION_THRESHOLD;
    const thermalAnomaly = temp >= THERMAL_THRESHOLD_C;
    const verdict = visionAnomaly || thermalAnomaly ? "ANOMALY" : "NORMAL";
    const triggeredBy = [];
    if (visionAnomaly) triggeredBy.push("vision");
    if (thermalAnomaly) triggeredBy.push("thermal");

    const id = crypto.randomUUID(); // 이벤트 id는 로봇(여기서는 이 페이지)이 만든다 — 서버는 새로 만들지 않는다
    const event = {
      id,
      robot_id: robotId,
      station_id: station.id,
      station_name: station.name,
      seq: ++seqCounter,
      ts: Date.now() / 1000, // 로봇은 epoch 숫자로 보낸다 (CLAUDE.md 연동 규격)
      x: station.x,
      y: station.y,
      yaw: station.yaw,
      pose_error: {
        pos_m: Number((Math.random() * 0.05).toFixed(4)),
        yaw_rad: Number((Math.random() * 0.03).toFixed(4)),
      },
      verdict,
      triggered_by: triggeredBy,
      vision: {
        is_anomaly: visionAnomaly,
        score,
        threshold: VISION_THRESHOLD,
        regions: visionAnomaly ? [{ bbox: [200, 150, 120, 100], area_px: 120 * 100 }] : [],
      },
      thermal: {
        is_anomaly: thermalAnomaly,
        max_temp_c: temp,
        threshold_c: THERMAL_THRESHOLD_C,
      },
    };

    const imageB64 = await getImageBase64();
    if (imageB64) {
      event.image_b64 = imageB64;
    }

    try {
      const res = await fetch("/api/events", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Robot-Token": token },
        body: JSON.stringify(event),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        log(`전송 실패 (HTTP ${res.status}): ${JSON.stringify(data)}`, false);
        return;
      }
      log(
        `${station.name} 전송 성공 verdict=${verdict} id=${id.slice(0, 8)} duplicate=${data.duplicate}`,
        true
      );
    } catch (err) {
      log(`전송 오류: ${err}`, false);
    }
  }

  async function sendNormalStatus() {
    const { token, robotId } = getCommonFields();
    if (!token) {
      log("토큰을 먼저 입력하세요", false);
      return;
    }

    const station = currentStation();
    const state = $("state").value;
    const battery = parseFloat($("battery").value);
    const yawDeg = parseFloat($("yaw").value);
    const yaw = (yawDeg * Math.PI) / 180; // 프로토콜은 라디안

    try {
      const res = await fetch("/api/robot/status", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Robot-Token": token },
        body: JSON.stringify({ robot_id: robotId, x: station.x, y: station.y, yaw, battery, state }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        log(`상태 갱신 실패 (HTTP ${res.status}): ${JSON.stringify(data)}`, false);
        return;
      }
      log(`로봇 상태 갱신: state=${state} battery=${battery}% yaw=${yawDeg}° (이벤트 없음)`, true);
    } catch (err) {
      log(`상태 갱신 오류: ${err}`, false);
    }
  }

  $("btn-send-event").addEventListener("click", sendEvent);
  $("btn-normal").addEventListener("click", sendNormalStatus);

  loadSaved();
  setupPhotoModeToggle();
  loadSampleList();
  updateStationInfo();
  updateJudgementPreview();
</script>
</body>
</html>
